services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nexevent
      POSTGRES_PASSWORD: nexevent
      POSTGRES_DB: nexevent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata: